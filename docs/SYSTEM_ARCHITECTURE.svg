<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">ECDAT static analysis architecture</title><desc id="desc">Source repositories are safely snapshotted and statically scanned, assessed by deterministic risk and recommendation engines, persisted locally, and shown by the web interface.</desc><rect width="1200" height="520" fill="#0b0d10"/><style>text{font-family:Arial,sans-serif;fill:#f5f1e9}.small{font-size:14px;fill:#b1b3b6}.head{font-size:18px;font-weight:bold}.box{fill:#171a1e;stroke:#35373b;stroke-width:2}.gold{stroke:#bda16f}.teal{stroke:#61a3a3}.blue{stroke:#5577b5}.line{stroke:#bda16f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bda16f"/></marker></defs><text x="54" y="55" class="head">ECDAT — verified static-analysis pipeline</text><g transform="translate(55 115)"><rect class="box gold" width="190" height="100" rx="14"/><text x="20" y="37" class="head">Source repository</text><text x="20" y="65" class="small">Python · JS/TS · Java</text><text x="20" y="85" class="small">No code execution</text></g><g transform="translate(305 115)"><rect class="box teal" width="220" height="100" rx="14"/><text x="20" y="37" class="head">Safe intake</text><text x="20" y="65" class="small">Path / ZIP validation</text><text x="20" y="85" class="small">Controlled snapshot workspace</text></g><g transform="translate(585 115)"><rect class="box teal" width="220" height="100" rx="14"/><text x="20" y="37" class="head">Discovery engine</text><text x="20" y="65" class="small">AST + heuristic scanners</text><text x="20" y="85" class="small">Evidence, operation, key size</text></g><g transform="translate(865 115)"><rect class="box gold" width="280" height="100" rx="14"/><text x="20" y="37" class="head">Deterministic assessment</text><text x="20" y="65" class="small">Current security + quantum risk</text><text x="20" y="85" class="small">Mosca scenario + recommendations</text></g><path class="line" d="M245 165H305M525 165H585M805 165H865"/><g transform="translate(205 325)"><rect class="box blue" width="240" height="110" rx="14"/><text x="20" y="38" class="head">CBOM + graph</text><text x="20" y="67" class="small">Structured inventory</text><text x="20" y="89" class="small">JSON / CSV exports</text></g><g transform="translate(485 325)"><rect class="box blue" width="230" height="110" rx="14"/><text x="20" y="38" class="head">Local persistence</text><text x="20" y="67" class="small">SQLite / SQLAlchemy</text><text x="20" y="89" class="small">Completed scan results</text></g><g transform="translate(755 325)"><rect class="box gold" width="270" height="110" rx="14"/><text x="20" y="38" class="head">Next.js interface</text><text x="20" y="67" class="small">Findings · CBOM · Map</text><text x="20" y="89" class="small">Mitigate → Migrate → Verify</text></g><path class="line" d="M1005 215V270H325V325M1005 215V325M1005 215V270H600V325M715 380H755"/></svg>
